name: OCR quality sample
description: Help improve recognition with a privacy-safe, reproducible sample
title: "[OCR]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for helping improve PingYi OCR. Remove names, accounts, keys, private conversations, and other sensitive data before attaching an image.

        感谢帮助改进屏译。上传样本前请遮挡姓名、账号、密钥、私人对话及其他敏感信息。
  - type: input
    id: version
    attributes:
      label: PingYi version / 屏译版本
      placeholder: Version shown in Help / 帮助页面中的版本
    validations:
      required: true
  - type: dropdown
    id: provider
    attributes:
      label: Current model location / 当前模型位置
      options:
        - App-managed local multimodal model
        - External local model (Ollama / LM Studio / compatible service)
        - Cloud multimodal API
        - Other
    validations:
      required: true
  - type: input
    id: model
    attributes:
      label: Current model ID / 当前模型 ID
      description: Model ID only; do not paste API keys or private endpoint URLs.
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform / 平台
      options:
        - Windows 11 x64
        - Windows 10 x64
        - Ubuntu X11 x64
        - Other
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected text / 预期文字
      description: Paste only privacy-safe expected text.
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Recognized text / 实际识别结果
      description: Paste only privacy-safe recognized text.
    validations:
      required: true
  - type: textarea
    id: sample
    attributes:
      label: Redacted sample image / 已脱敏样本图
      description: Drag in a cropped, redacted image if it is safe to publish under this repository's issue history.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy confirmation / 隐私确认
      options:
        - label: I removed credentials and private information from all attached material. / 我已移除凭据和私人信息。
          required: true
