name: Configuration continuation validation
on:
  push:
    branches: [refactor/configuration-center]
    paths: [.github/config-stage2.py, .github/workflows/config-stage2.yml]
permissions:
  contents: read
env:
  PYTHONUTF8: '1'
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - name: Apply deterministic continuation patch
        run: python .github/config-stage2.py
      - name: Install fonts and native test tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk xvfb xauth xdotool x11-utils scrot dbus-x11 python3-gi openbox
      - run: dotnet restore PingYi.slnx
      - run: dotnet build PingYi.slnx -c Release --no-restore
      - run: dotnet test PingYi.slnx -c Release --no-build
        env:
          PINGYI_UI_ARTIFACTS: ${{ github.workspace }}/artifacts/ui
      - run: python -m unittest discover -s engine_host -p "test_*.py"
      - run: python -m unittest discover -s scripts -p "test_*.py"
      - name: Upload actual UI renders
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: config-continuation-ui-${{ matrix.os }}
          path: artifacts/ui/*.png
          if-no-files-found: ignore
          retention-days: 7
  commit:
    needs: verify
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
      - name: Apply tested patch and commit only to the unchanged refactor branch
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          branch=refactor/configuration-center
          test "$(git ls-remote origin refs/heads/$branch | cut -f1)" = "$EXPECTED_SHA"
          python3 .github/config-stage2.py
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src tests README.md README.en.md THIRD_PARTY_NOTICES.md
          git commit -m 'feat(config): add passive task overview and task-scoped backend lifecycle'
          git push origin HEAD:refs/heads/$branch
