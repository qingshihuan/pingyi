name: Complete vision integration
on:
  push:
    branches: [feat/image-analysis-startup-reliability]
    paths:
      - '.github/vision-integration/**'
      - '.github/workflows/complete-vision-integration.yml'
permissions:
  contents: read
jobs:
  integrate:
    if: github.repository == 'qingshihuan/pingyi' && github.ref == 'refs/heads/feat/image-analysis-startup-reliability'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Apply exact reviewed source patch on feature branch only
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = 'refs/heads/feat/image-analysis-startup-reliability'
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git diff --exit-code dbc6abe5ad284ab2941b50d9173469582ea017e1 -- . ':!.github/vision-integration/*' ':!.github/workflows/complete-vision-integration.yml'
          python3 - <<'PY'
          import base64, hashlib, lzma, subprocess
          from pathlib import Path
          payload = ''.join((Path('.github/vision-integration') / f'part{i}.txt').read_text().strip() for i in range(4))
          patch = lzma.decompress(base64.b64decode(payload, validate=True), memlimit=128 * 1024 * 1024)
          assert len(patch) == 76703
          assert hashlib.sha256(patch).hexdigest() == 'f8d01dea5045240613f6fb4b52c7247339f6163da4afe7242e097fba95a3e5eb'
          subprocess.run(['git', 'apply', '--check', '--index', '-'], input=patch, check=True)
          subprocess.run(['git', 'apply', '--index', '-'], input=patch, check=True)
          PY
          git rm .github/vision-integration/part*.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Integrate image analysis UI, readiness regression tests and bounded diagnostics'
          git push origin HEAD:refs/heads/feat/image-analysis-startup-reliability
