name: Runtime integration verification
on:
  push:
    branches: [feat/hardware-aware-runtime]
    paths: [scripts/integrate-runtime.py, scripts/runtime-followup.py, scripts/runtime-verification-fixes.py, .github/workflows/runtime-integration.yml]
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - name: Integrate exact reviewed edits
        env:
          PYTHONUTF8: '1'
        run: |
          python scripts/integrate-runtime.py
          python scripts/runtime-followup.py
          python scripts/runtime-verification-fixes.py
      - name: Chinese fonts for UI snapshots
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk
      - name: Build and test complete solution (fail on every native command)
        env:
          PINGYI_UI_ARTIFACTS: ${{ github.workspace }}/artifacts/ui
        run: |
          dotnet test PingYi.slnx -c Release
          python -m unittest discover -s engine_host -p 'test_*.py'
          python -m unittest discover -s scripts -p 'test_*.py'
          git diff --check
      - name: Real official CPU runtime package smoke test
        env:
          PINGYI_RUNTIME_PACKAGE_SMOKE: '1'
        run: dotnet test tests/PingYi.Core.Tests/PingYi.Core.Tests.csproj -c Release --no-build --filter FullyQualifiedName~RuntimePackageSmokeTests --logger 'console;verbosity=normal'
      - name: Archive the exact tested source (no generated binaries)
        if: always()
        run: |
          python - <<'PY'
          import subprocess, tarfile
          from pathlib import Path
          paths = subprocess.check_output(['git', 'ls-files', '-z'], text=True).split('\0')
          with tarfile.open('runtime-tested-source.tar.gz', 'w:gz') as archive:
              for name in paths:
                  if name and Path(name).is_file():
                      archive.add(name, arcname=name, recursive=False)
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: runtime-integration-${{ matrix.os }}
          path: |
            artifacts/ui/*.png
            runtime-tested-source.tar.gz
          retention-days: 3
  commit:
    needs: validate
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Commit the exact tested edits, removing one-use tools
        run: |
          python3 scripts/integrate-runtime.py
          python3 scripts/runtime-followup.py
          python3 scripts/runtime-verification-fixes.py
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src tests scripts .github README.md README.en.md THIRD_PARTY_NOTICES.md docs
          git commit -m 'feat: integrate hardware-aware runtime manager, GPU choice and inference timeout fixes'
          git push origin HEAD:feat/hardware-aware-runtime
