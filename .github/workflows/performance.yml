name: Performance validation

on:
  push:
    branches: [ui/workspace-settings-redesign]
    paths:
      - '.github/workflows/performance.yml'
      - 'scripts/measure-startup.py'
      - 'engine_host/**'
      - 'src/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  performance:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Archive tracked inputs for reproducibility
        run: git archive --format=zip --output=performance-source.zip HEAD
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: performance-source
          path: performance-source.zip
          retention-days: 3
