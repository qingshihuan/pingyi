name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: Version to place in the package names
        required: true
        default: 0.1.0

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Build Windows release
        shell: pwsh
        run: |
          $version = if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            "${{ inputs.version }}"
          } else {
            "${{ github.ref_name }}".TrimStart("v")
          }
          ./scripts/setup-engine.ps1 -Python python
          python ./scripts/download-offline-models.py --destination ./artifacts/model-source
          ./scripts/prepare-offline-models.ps1 `
            -Source ./artifacts/model-source `
            -Destination ./artifacts/quality-models
          ./scripts/run-quality-baseline.ps1 -ModelDirectory ./artifacts/quality-models
          choco install innosetup --yes --no-progress
          $env:PATH += ";C:\Program Files (x86)\Inno Setup 6"
          ./scripts/publish.ps1 -Runtime win-x64 -Version $version `
            -OfflineModelSource ./artifacts/model-source -BuildInstaller
      - uses: actions/upload-artifact@v7
        with:
          name: windows-release
          path: |
            artifacts/PingYi-*-win-x64.zip
            packaging/windows/Output/*-setup.exe

  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install packaging tools
        run: sudo apt-get update && sudo apt-get install -y python3-venv dpkg-dev
      - name: Build Linux release
        run: |
          chmod +x scripts/*.sh
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            version="${{ inputs.version }}"
          else
            version="${GITHUB_REF_NAME#v}"
          fi
          ./scripts/setup-engine.sh
          python scripts/download-offline-models.py --destination artifacts/model-source
          ./scripts/build-engine.sh
          PINGYI_OFFLINE_MODEL_SOURCE="$PWD/artifacts/model-source" ./scripts/publish.sh "$version"
      - uses: actions/upload-artifact@v7
        with:
          name: linux-release
          path: |
            artifacts/PingYi-*-linux-x64.tar.gz
            artifacts/PingYi-*-linux-x64.deb

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: release-files
          merge-multiple: true
      - name: Collect release assets
        run: |
          mkdir release-assets
          find release-files -type f -print0 |
            while IFS= read -r -d '' file; do
              cp "$file" "release-assets/$(basename "$file")"
            done
      - name: Generate checksums
        working-directory: release-assets
        run: sha256sum ./* > SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: release-assets/*
