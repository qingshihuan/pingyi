name: Validate manual runtime switching
on:
  push:
    branches: [fix/vulkan-default-switch-v081]
permissions:
  contents: read
concurrency:
  group: integrate-manual-runtime-v081
  cancel-in-progress: true
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - name: Integrate exact reviewed changes
        shell: bash
        run: python scripts/apply-v081.py
      - name: Fonts for Chinese UI tests
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk
      - name: Full tests (every command must succeed)
        shell: bash
        env:
          PINGYI_UI_ARTIFACTS: ${{ github.workspace }}/artifacts/ui
        run: |
          set -euo pipefail
          dotnet test PingYi.slnx -c Release
          python -m unittest discover -s engine_host -p 'test_*.py'
          python -m unittest discover -s scripts -p 'test_*.py'
          git diff --check
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: manual-runtime-ui-${{ matrix.os }}
          path: artifacts/ui/*.png
          retention-days: 3
  commit:
    needs: test
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/vulkan-default-switch-v081
      - name: Commit only the exact tested integration
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 scripts/apply-v081.py
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src tests scripts README.md README.en.md THIRD_PARTY_NOTICES.md docs .github
          git commit -m 'feat: integrate Vulkan default and verified manual runtime switching'
          git push origin HEAD:fix/vulkan-default-switch-v081
