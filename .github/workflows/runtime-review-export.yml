name: Runtime review export
on:
  push:
    branches: [feat/hardware-aware-runtime]
    paths: [.github/workflows/runtime-review-export.yml]
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Export tracked source and public upstream metadata only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/runtime-review
          git archive HEAD -o /tmp/runtime-review/source.zip
          gh api 'repos/ggml-org/llama.cpp/releases?per_page=12' > /tmp/runtime-review/llama-releases.json
          gh api repos/ggml-org/llama.cpp/releases/latest > /tmp/runtime-review/llama-latest.json
          gh api repos/ggml-org/llama.cpp/contents/.github/workflows > /tmp/runtime-review/llama-workflows.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: runtime-source-review
          path: /tmp/runtime-review/*
          retention-days: 2
