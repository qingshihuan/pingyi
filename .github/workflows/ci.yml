name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore PingYi.slnx
      - run: dotnet build PingYi.slnx -c Release --no-restore
      - run: dotnet test PingYi.slnx -c Release --no-build
      - run: python -m py_compile engine_host/main.py
      - run: python -m unittest discover -s engine_host -p "test_*.py"
