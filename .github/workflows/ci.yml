name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"
      - name: Install Chinese fonts and native desktop test tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk xvfb xauth xdotool x11-utils scrot dbus-x11 python3-gi openbox
      - run: dotnet restore PingYi.slnx
      - run: dotnet build PingYi.slnx -c Release --no-restore
      - run: dotnet test PingYi.slnx -c Release --no-build
        env:
          PINGYI_UI_ARTIFACTS: ${{ github.workspace }}/artifacts/ui
      - run: python -m py_compile engine_host/main.py
      - run: python -m unittest discover -s engine_host -p "test_*.py"
      - run: python -m unittest discover -s scripts -p "test_*.py"
      - name: Native X11 conflict and screenshot portal tests
        timeout-minutes: 5
        if: runner.os == 'Linux'
        run: |
          dbus-run-session -- xvfb-run -a bash -euo pipefail -c '
            export XDG_SESSION_TYPE=x11
            export PINGYI_LINUX_NATIVE_TESTS=1
            export PINGYI_PORTAL_READY="$RUNNER_TEMP/portal-ready"
            export PINGYI_PORTAL_CLOSED="$RUNNER_TEMP/portal-closed"
            /usr/bin/python3 scripts/linux-portal-fixture.py &
            fixture=$!
            trap "kill $fixture 2>/dev/null || true" EXIT
            for i in $(seq 1 100); do
              test -f "$PINGYI_PORTAL_READY" && break
              sleep 0.05
            done
            test -f "$PINGYI_PORTAL_READY"
            dotnet test tests/PingYi.Core.Tests/PingYi.Core.Tests.csproj -c Release --no-build --filter FullyQualifiedName~LinuxDesktopTests
            bash scripts/test-linux-desktop.sh
          '
      - name: Upload rendered UI snapshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ui-snapshots-${{ matrix.os }}
          path: artifacts/ui/*.png
          if-no-files-found: ignore
          retention-days: 7
